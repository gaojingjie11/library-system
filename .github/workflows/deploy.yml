name: Deploy library system

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SERVER_IP:?Missing SERVER_IP}"
          : "${SERVER_USER:?Missing SERVER_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SERVER_SSH_KEY}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H -p 22 "$SERVER_IP" > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 644 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p 22 "$SERVER_USER@$SERVER_IP" \
            "cd '/opt/library-system' && git pull --ff-only origin main && docker compose -p library-system up -d --build --remove-orphans && docker compose -p library-system ps"
